name: Build SpaceDownload macOS

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: "Release name, for example 2026083101"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift package
        run: swift test
      - name: Download standalone yt-dlp
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./prepare_tools.sh
      - name: Build SpaceDownload app
        run: ./build_app.sh
      - name: Verify app and bundled engine
        run: |
          codesign --verify --deep --strict "dist/SpaceDownload.app"
          "dist/SpaceDownload.app/Contents/Resources/yt-dlp" --version
      - name: Create DMG
        run: |
          mkdir -p build/dmg
          ditto "dist/SpaceDownload.app" "build/dmg/SpaceDownload.app"
          hdiutil create -volname "SpaceDownload" \
            -srcfolder build/dmg \
            -ov -format UDZO \
            "dist/SpaceDownload-${{ inputs.release_name }}-macos.dmg"
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ inputs.release_name }}" >/dev/null 2>&1 || \
            gh release create "${{ inputs.release_name }}" --title "${{ inputs.release_name }}" --notes "SpaceDownload release ${{ inputs.release_name }}"
          gh release upload "${{ inputs.release_name }}" \
            "dist/SpaceDownload-${{ inputs.release_name }}-macos.dmg" \
            --clobber
